<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cascading stylesheet</title>
    <!-- CSS embedded (embutido) -->
    <style>
        p{
            font-size: 100px;color: rebeccapurple;
            
        }
        #gato{color: crimson;
        }
        #cachorro{color: brown;}
    </style>
</head>
<body>
    <!-- CSS inline é aquele que vai dentro da própria tag -->

    <p style="color: rebeccapurple; font-size: 100px ;">Paulo</p>
    <p id="cachorro">maya</p>
    <p id="gato">apolo</p>


</body>
</html>
