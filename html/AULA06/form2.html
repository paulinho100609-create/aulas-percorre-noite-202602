<!DOCTYPE html>
<html lang="pt - br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 2 - radio e checkbox</title>
</head>
<body>
    <header></header>
    <main>


        <form action="">
            <label for="">insira seu e-mail:</label>
            <input type="email" name="email" id="email" required="true" placeholder="joão123@email.com">

             <br>
             <br>

             <label for="nome">insira seu nome:</label>
             <input type="text" name="nome" id="nome" required="true" maxlength="20" placeholder="joão da silva">
              
             <br>
             <br>

             <label for="">escolha sua cor:</label>
             <input type="color" name="color" id="color">

             <br>
             <br>

             <label for="">avalie o atendimento:</label>

             <br>

             <input type="radio" name="estrelas" id="3estrelas" value="3">
             <label for="3 estrelas">⭐⭐⭐</label>

             <br>

             <input type="radio" name="estrelas" id="2estrelas" value="2">
             <label for="2 estrelas">⭐⭐</label>

             <br>

             <input type="radio" name="estrelas" id="1estrelas" value="1">
             <label for="1 estrelas">⭐</label>

             <br>
             
        </form>

        <br>

        <label for="comentario">DEIXE SEU COMENTARIO:</label>

        <br>

        <textarea name="" id="comentario" placeholder="seu comentario"></textarea>

        <br>

        <input type="submit" value="enviar!">

    </main>
    <footer></footer>
</body>
</html>
